name: Release

# Push a tag like v0.1.0 to publish a GitHub release with binaries and a
# container image on ghcr.io. Running the workflow by hand only builds the
# binaries and uploads them as a workflow artifact (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no go.sum: the module has no dependencies

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=devin2api_${VERSION}_${os}_${arch}
            ext=""; [ "$os" = windows ] && ext=.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ngh1105/Devin2API/internal/buildinfo.Version=$VERSION" \
              -o "build/$name/devin2api$ext" ./cmd/devin2api
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Upload artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: devin2api-binaries
          path: dist/

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes

  image:
    if: github.ref_type == 'tag'
    needs: binaries # never publish an image whose tests failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
