name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The project is mainly run on Windows; Linux covers the release targets.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no go.sum: the module has no dependencies

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t devin2api:ci .

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm devin2api:ci version
          docker run -d --name d2 -p 127.0.0.1:8080:8080 -e DEVIN2API_ADMIN_PASSWORD=ci-pass devin2api:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok"'
          # Requests reach the container from the bridge network, not loopback,
          # so the admin API needs the password.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Devin2API: 1' http://127.0.0.1:8080/admin/api/tokens)
          [ "$code" = 401 ] || { echo "admin without login returned $code"; exit 1; }
          curl -fsS -c jar -X POST -H 'X-Devin2API: 1' -H 'Content-Type: application/json' \
            -d '{"password":"ci-pass"}' http://127.0.0.1:8080/admin/api/login
          # The data volume must be writable by the nonroot user.
          curl -fsS -b jar -X POST -H 'X-Devin2API: 1' http://127.0.0.1:8080/admin/api/tokens | grep -q d2sk_
          docker logs d2
          docker rm -f d2
