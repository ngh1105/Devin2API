<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin Settings</title>
<link rel="stylesheet" href="/web/styles.css">
</head>
<body data-page="settings">
<header>Dev<span>in</span></header>
<main>
  <h1>Settings</h1>
  <div id="status"></div>
  <form id="settings-form" onsubmit="return false;">
    <label>Listen: <input id="s-listen" readonly disabled></label><br>
    <label>Data dir: <input id="s-data-dir" readonly disabled></label><br>
    <label>Version: <input id="s-version" readonly disabled></label><br>
    <p class="note">Changes require environment variables and a restart.</p>
  </form>
</main>
<script src="/web/app.js"></script>
</body>
</html>
