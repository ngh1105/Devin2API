<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devin Accounts</title>
<link rel="stylesheet" href="/web/styles.css">
</head>
<body data-page="accounts">
<header>Dev<span>in</span></header>
<main>
  <h1>Accounts</h1>
  <section id="import-section">
    <textarea id="import-ta" rows="6" placeholder='{"access_token":"...","refresh_token":"..."}'></textarea>
    <button id="import-btn">Import JSON</button>
  </section>
  <section id="login-section">
    <input id="login-email" type="email" placeholder="Email"><input id="login-pass" type="password" placeholder="Password">
    <button id="login-btn">Login</button>
  </section>
  <div id="status"></div>
  <table id="acct-table">
    <thead><tr><th>Email</th><th>Sub</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script src="/web/app.js"></script>
</body>
</html>
